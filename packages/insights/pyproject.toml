[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-insights"
version = "1.0.0b1"
description = "Report generation and analytics for METIS evaluation results"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
    "pydantic>=2",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
metis-insights = "metis.insights.cli:app"

[tool.uv.sources]
metis-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
