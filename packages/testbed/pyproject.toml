[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-testbed"
version = "1.0.0b1"
description = "Shared evaluation data and review tools for METIS components"
requires-python = ">=3.11"
dependencies = [
    "metis-core",
    "metis-wizard",
    "openai>=1.40",
    "pyyaml>=6.0",
    "typer>=0.9.0",
]

[project.scripts]
metis-testbed = "metis.testbed.cli:app"

[tool.uv.sources]
metis-core = { workspace = true }
metis-wizard = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]

[tool.hatch.build.targets.sdist]
exclude = ["/wizard/.reviewer"]
