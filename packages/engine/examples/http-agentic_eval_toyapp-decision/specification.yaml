schema_version: 1
id: toyapp-http-decision
runner_factory_ref: metis.engine.simulation.runners.http.HttpRunnerFactory
target_binding: toyapp-api.yaml
target:
  name: Employee Policy Assistant
  users: Employees of Northstar Services, a fictional company.
  description: A lightweight RAG application that answers employee policy questions using
    a fixed document collection.
  detail: ''
features:
- id: F-1
  name: Employee policy question answering
  description: Answer employees' questions about the supported policies using the fixed policy
    collection.
  behaviours:
  - id: EB-2
    name: Addresses the employee's actual question and instructions
    description: The response is relevant to what the employee asked and follows their explicit
      constraints, without adding unnecessary information or friction.
    measured: true
    criteria:
    - id: AC-2-1
      name: Addresses the question asked
      description: Given an employee policy question, when the target responds to the question,
        then the response addresses the substance of the employee’s actual question.
      grader_fqn: metis.library.graders.CriterionDecisionGrader
      grader_args:
        provider: typesafe
        model: jev-latest
        threshold: 0.5
    - id: AC-2-2
      name: Follows explicit response instructions
      description: Given an employee question that includes explicit instructions about the
        response, when the target responds to the question, then the response follows those
        instructions.
      grader_fqn: metis.library.graders.CriterionDecisionGrader
      grader_args:
        provider: typesafe
        model: jev-latest
        threshold: 0.5
    - id: AC-2-3
      name: Avoids unrelated additions
      description: Given an employee policy question with a direct answer available, when
        the target responds to the question, then the response does not add information
        unrelated to the question.
      grader_fqn: metis.library.graders.CriterionDecisionGrader
      grader_args:
        provider: typesafe
        model: jev-latest
        threshold: 0.5
personas:
- id: constraint-focused-questioner
  name: Constraint-focused questioner
  description: States clear requirements for the answer, such as what to include or leave
    out, and notices when those instructions are not followed.
  metadata: {}
scenarios:
- id: S-1
  name: Concise annual leave answer
  description: The employee asks, “How many annual leave days do employees get? Please answer
    in no more than two sentences and mention any important limits.”
  metadata:
    policy_area: Annual Leave Policy
tasks:
- id: TC-001
  scenario_ref: S-1
  persona_ref: constraint-focused-questioner
  fixtures: []
  num_trials: 1
  behaviour_refs:
  - EB-2
  max_turns: 10
  timeout_minutes: 10
  response_wait_ms: 60000
  max_run_retries: 2
fixture_content_descriptions: {}
