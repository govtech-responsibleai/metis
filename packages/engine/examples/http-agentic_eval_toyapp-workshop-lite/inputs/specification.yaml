schema_version: 1
id: toyapp-workshop-lite
runner_factory_ref: metis.engine.simulation.runners.http.HttpRunnerFactory
target_binding: toyapp-api.yaml
target:
  name: Employee Policy Assistant
  users: Employees of Northstar Services.
  description: An employee assistant that answers policy questions from a fixed policy
    collection and analyses reports that employees upload.
  detail: ''
features:
- id: F-1
  name: Employee policy question answering
  description: Answer employees' questions about the supported policies using the fixed policy
    collection.
  behaviours:
  - id: EB-2
    name: Addresses the employee's actual question and instructions
    description: The response is relevant to what the employee asked and follows their explicit
      constraints, without adding unnecessary information or friction.
    measured: true
    criteria:
    - id: AC-2-1
      name: Addresses the question asked
      description: Given an employee policy question, when the target responds to the question,
        then the response addresses the substance of the employee’s actual question.
      grader_fqn: metis.library.graders.RelevanceGrader
      grader_args:
        threshold: 0.8
        purpose: answers questions from Northstar Services employees about company policies,
          using a fixed policy collection.
    - id: AC-2-2
      name: Follows explicit response instructions
      description: Given an employee question that includes explicit instructions about the
        response, when the target responds to the question, then the response follows those
        instructions.
      grader_fqn: metis.library.graders.CriterionJudgeGrader
      grader_args:
        threshold: 0.8
  - id: EB-3
    name: Resolves material ambiguity or missing information appropriately
    description: When missing or conflicting details could change the answer, asks a concise,
      useful clarifying question; when the available information cannot answer the question,
      makes that limitation clear rather than presenting a guess.
    measured: true
    criteria:
    - id: AC-3-2
      name: States when policy information is unavailable
      description: Given a question that cannot be answered from the available policy information,
        when the target responds to the question, then the response clearly states that
        the available information does not establish the answer, rather than guessing.
      grader_fqn: metis.library.graders.CriterionJudgeGrader
      grader_args:
        threshold: 0.5
- id: F-2
  name: Report analysis
  description: Analyse a report that the employee uploads and answer questions about it from
    the report's content only.
  behaviours:
  - id: EB-6
    name: Grounded in the uploaded report
    description: Answers do the report task that the employee asked for, take their findings
      and figures from the report, and keep the limitations that the report states.
    measured: true
    criteria:
    - id: AC-6-1
      name: Supported by the report
      description: Given an uploaded report and a question about it, when the target answers
        the question, then every factual claim in the answer is supported by the report.
      grader_fqn: metis.library.graders.ClaimSupportByEvidenceGrader
      grader_args:
        threshold: 0.8
        turn: each
    - id: AC-6-2
      name: Addresses the report task
      description: Given an uploaded report and a request about it, when the target responds,
        then the response does the report task that the employee asked for.
      grader_fqn: metis.library.graders.RelevanceGrader
      grader_args:
        threshold: 0.8
        purpose: answers questions from Northstar Services employees about company policies,
          and summarises and explains reports that they upload.
    - id: AC-6-3
      name: States the report's limitations
      description: Given an uploaded report that states limitations on its findings, when
        the target answers a question about the report, then the answer keeps the limitations
        that affect how the findings can be read.
      grader_fqn: metis.library.graders.ContentFidelityGrader
      grader_args:
        threshold: 0.8
        turn: each
        fidelity_requirements:
        - When an answer uses revenue, it says that the revenue figure is an unaudited management
          estimate.
        - When an answer generalises the findings, it says that the report covers Singapore
          operations only.
        - When an answer explains why a figure changed, it says that the report does not establish
          a cause.
        - When an answer uses complaints, it says that the report gives only a relative change
          and no absolute count.
        - When an answer says what is being done about supplier risk, it says that the report
          recommends identifying substitutes but does not say that a substitute is available.
- id: F-3
  name: Request routing
  description: Decide for each employee message whether to answer directly, ask a clarifying
    question, or hand the request to the policy specialist or the report analysis specialist.
  behaviours:
  - id: EB-7
    name: Sends each request to the right specialist
    description: Each message goes to the specialist whose evidence can answer it. The choice
      follows what the employee asks for, not whether a file is attached.
    measured: true
    criteria:
    - id: AC-7-1
      name: Appropriate routing
      description: Given an employee message, when the assistant decides how to handle it,
        then the chosen route suits what the employee asked for and the evidence that can
        answer it.
      grader_fqn: metis.library.graders.ActionChoiceAppropriatenessGrader
      grader_args:
        threshold: 0.5
        available_tools:
        - 'answer: the coordinator replies directly, for greetings, capability questions,
          and requests outside the supported policies.'
        - 'clarify: the coordinator asks one focused question when the task, the policy
          topic, or the needed report is missing or ambiguous.'
        - 'route_rag: the coordinator hands one focused policy question to the policy
          specialist, which searches the fixed policy collection.'
        - 'route_analysis: the coordinator hands one findings or synthesis task to the
          report analysis specialist, with only the uploaded reports that the task needs.'
        assessment_criteria:
        - The route follows the task that the employee asks for. An attached file alone does
          not decide the route.
        - A question about a Northstar policy goes to route_rag, also when a report is attached.
        - A request for findings, figures, or a summary of an attached report goes to route_analysis.
        - When the task, the policy topic, or the report that the request needs is missing or
          ambiguous, one focused clarifying question is appropriate. For a request about data
          that the attached report does not cover, such as another region, a clarifying question
          and route_analysis are both appropriate.
        - A greeting, a capability question, or a clearly out-of-scope request is answered directly.
        - Each message goes to at most one specialist.

personas:
- id: direct-employee-questioner
  name: Direct employee questioner
  description: Asks a straightforward policy question and prefers a direct, understandable
    answer without extra detail.
  metadata:
    role: employee
- id: fragmented-persistent-changing-mind-questioner
  name: Fragmented, persistent, changing-mind questioner
  description: Provides relevant details in pieces, may revise what they want partway through,
    and expects the response to reflect the latest information.
  metadata: 
    position: a busy senior employee 
- id: eager-new-hire
  name: Eager new hire employee
  description: Just joined Northstar and is highly curious. Asks a lot of questions, and may 
    give a list of questions or jump around different types of questions.
  metadata: 
    age: "25"
    gender: female
    role: Junior employee

scenarios:
- id: S-3
  name: Question outside the policy collection
  description: The employee wants to bring their dog to the office as they have an event after
    work and does not have the time to pick up their dog after work and before the event. Hence 
    they need to dig through Northstar's policy to figure this out. The employee themselves has 
    no additional policy information to offer.
  metadata: 
    success_condition: The assistant has to provide a definitive yes or no answer.
- id: S-5
  name: Report analysis followed by a policy question
  description: The employee uploads northstar-q2-service-review.md, selects it, and asks for
    the main findings and limitations of the Q2 service review. After the answer, with the
    report still attached, the employee asks a policy question that the report does not
    cover - how long they have to submit an expense claim.
  metadata:
    starting_question: Summarise the main findings and limitations of this report.
    follow_up: Separately, what's the deadline for submitting an expense claim?


tasks:
- id: TC-004
  scenario_ref: S-3
  persona_ref: fragmented-persistent-changing-mind-questioner
  fixtures: []
  num_trials: 3
  behaviour_refs:
  - EB-2
  - EB-3
  - EB-7
  max_turns: 10
  timeout_minutes: 10
  response_wait_ms: 60000
  max_run_retries: 2
- id: TC-006
  scenario_ref: S-3
  persona_ref: eager-new-hire
  fixtures: []
  num_trials: 1
  behaviour_refs:
  - EB-2
  - EB-3
  - EB-7
  max_turns: 10
  timeout_minutes: 10
  response_wait_ms: 60000
  max_run_retries: 2
- id: TC-008
  scenario_ref: S-5
  persona_ref: direct-employee-questioner
  fixtures:
  - northstar-q2-service-review.md
  num_trials: 2
  behaviour_refs:
  - EB-6
  - EB-7
  max_turns: 10
  timeout_minutes: 15
  response_wait_ms: 120000
  max_run_retries: 2
fixture_content_descriptions:
  northstar-q2-service-review.md: A synthetic Northstar Services Q2 2026 service review for
    Singapore operations. It reports revenue, ticket, response, satisfaction, complaint,
    supplier and training figures, and lists what is missing, such as operating costs, profit
    margin and absolute complaint counts. It makes no causal claim.
