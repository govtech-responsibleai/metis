[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-wizard"
version = "1.0.0b1"
description = "Interactive evaluation setup wizard and CLI generator"
requires-python = ">=3.11"
dependencies = [
    "metis-core>=0.3.0",
    "metis-library>=0.1.4",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pypdf>=6.21.2,<7.0",
    "python-docx>=1.2,<2.0",
    "openai>=1.40",
    # The target connection check fetches the OpenAPI document or the start page.
    "httpx>=0.27",
    # The terminal choice screens read arrow keys, Space, Enter, and Esc.
    "prompt_toolkit>=3.0",
    # Langfuse's `langfuse.openai` drop-in traces every model call; imported in the gateway. A
    # base dependency, not an extra: the wrapper imports at start and, with no
    # METIS_INTERNAL_LANGFUSE_* config, sends nothing. Server target v3.153.0 uses the Python SDK v3 line.
    "langfuse>=3.0,<4.0",
]

[project.scripts]
metis-wizard = "metis.wizard.bootstrap:cli_app"

[tool.uv.sources]
metis-core = { workspace = true }
metis-library = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]
