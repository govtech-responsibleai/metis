uantify the associated financial exposure or establish that a disruption occurred.\n- **Training:** **190 of 250 eligible staff (76%)** had completed required training by the reporting cutoff. Completion is not evidence of competence, behavioral change, or reduced operational risk.\n\n## Key limitations and unanswered questions\n\n- The review covers **Singapore operations only** and should not be generalized to Northstar organisation-wide performance.\n- It uses rounded aggregate data without record-level extracts, independent audit, confidence intervals, statistical tests, or causal analysis. Q1 and Q2 comparisons are also not adjusted for calendar-day or staffing differences.\n- Revenue cannot be interpreted as improved profit, cash generation, or unit economics because operating costs, capital expenditure, margins, and collection dates are absent.\n- The service results lack response-time distributions, priority or ticket-type breakdowns, unresolved-backlog figures, and Q1-to-Q2 staffing data. Thus, the report does not show that every customer received faster service or that a particular staffing or workflow change caused the improvement.\n- Survey representativeness is unknown: invitation totals and Q1 response counts are missing, and customers with open tickets may be underrepresented.\n- The complaint reduction cannot be converted into a count or assumed to apply to every complaint category; changes in reporting behavior are unknown.\n- Supplier concentration is a risk indicator, not evidence of a security incident or service failure. The report gives no supplier identity, purchase value, category exposure, alternative supplier, or tested mitigation plan.\n\n## Interpretation boundary\n\nThe document supports a cautious description of observed Q2 changes and identified risks. It does **not** support claims that Northstar as a whole became more profitable, safer, or more efficient, or that any specific intervention caused the reported improvements.","errors":[]},{"turn":2,"user":"Separately, what's the deadline for submitting an expense claim?","target":"Expense claims must be submitted within **30 calendar days of the purchase**. [EXPENSE-001#1]","errors":[]}],"category":"succeeded","features":["Report analysis","Request routing"]},{"id":"TC-008-direct-employee-questioner-2","task_id":"TC-008","trial_index":2,"session":"00000000-0000-4000-8000-000000000002","persona":"direct-employee-questioner","scenario":"S-5","stopReason":"goal_achieved","message":"goal_achieved","failureSource":"outcome","simulated_turns_completed":2,"duration":35.3,"attempt":1,"conversation":[{"turn":1,"user":"Summarise the main findings and limitations of this report.","target":"## Main reported observations\n- **Revenue:** Q2 revenue was reported as **$4.2 million**, up **18% from Q1**. This is an **unaudited management estimate**, not an audited financial result.\n- **Service activity:** The teams recorded **1,240 new tickets**, up **6%** from Q1. Median first-response time fell from **7.4 to 6.2 hours**\u2014a reported **1.2-hour reduction**\u2014and the share resolved within two days rose from **78% to 81%**.\n- **Customer feedback:** **84% of 420 Q2 survey responses** were favorable, compared with **79% in Q1**, a five-percentage-point increase. Complaints were reported as **down 9%**, but only as a relative change.\n- **Operational risks and readiness:** One supplier represented **62% of Q2 purchases**. **190 of 250 eligible staff (76%)** had completed required training by the reporting cutoff.\n\n## Estimates, data gaps, and qualifications\n- Revenue lacks operating costs, capital expenditure, profit margin, cash-collection data, customer-level detail, and a reconciliation to source records. The report therefore supports only the conclusion that **reported revenue rose**, not that profit, cash generation, or unit economics improved.\n- Ticket measures are aggregate observations. The report does not provide response-time distributions, urgent-ticket counts, unresolved backlog, priority or ticket-type breakdowns, confidence intervals, or a Q1-to-Q2 staffing comparison. Ticket growth could reflect demand, easier access, or recording changes; the report cannot distinguish these explanations.\n- The satisfaction result may not represent all customers: invitations, Q1 response counts, and respondent representativeness are unknown, and customers with open tickets may be underrepresented. The complaint decline cannot be converted into an absolute count or taken to mean every complaint category improved.\n- The supplier figure flags **concentration risk**, but the report omits supplier identity, purchase value, categories, disruption probability, exposure, and a tested alternative or mitigation plan. It does not establish a security incident, service failure, or resolved dependency.\n- Training completion is not evidence of staff competence, changed behavior, or reduced operational risk; no assessment, behavioral measure, deadline, budget, or prior-quarter comparator is provided.\n\n## Conclusions the report does not support\n- The data do **not** establish causation: no particular staffing, workflow, training, or other initiative can be credited with the observed service improvements.\n- They do **not** establish statistical significance, organisation-wide performance, improved profitability, safer operations, greater efficiency, or sustainable revenue growth. The scope is limited to Singapore operations, and several measures lack Q1 comparators.\n- Overall, the report supports a cautious description of favorable aggregate service and customer-feedback movements alongside material financial, supplier, measurement, and data-quality uncertainties.","errors":[]},{"turn":2,"user":"Separately, what's the deadline for submitting an expense claim?","target":"Expense claims must be submitted within **30 calendar days of the purchase**. [EXPENSE-001#1]","errors":[]}],"category":"succeeded","features":["Report analysis d for a definitive yes or no and, if the policy was silent, for the default rule and an answer on that basis. The assistant again refused to give yes or no and said no default rule exists, so it did not follow the fallback instruction. Only in Turn 3, when asked directly for yes or no, did it answer \"No\" and explain the approval requirement. Two of the three instruction-bearing turns did not comply, so the criterion is not met overall.","measurements":null,"persona":"fragmented-persistent-changing-mind-questioner","scenario":"S-3"},{"task_id":"TC-004","trial_index":2,"session":"00000000-0000-4000-8000-000000000004","criterion_id":"AC-2-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given an employee question that includes explicit instructions about the response, when the target responds to the question, then the response follows those instructions."},"run_score":0.0,"run_threshold":0.8,"run_outcome":"failed","result_number":1,"status":"fail","outcome":"failed","score":0.0,"message":"The agent followed the explicit instructions only in the last turn. In Turn 1 the user asked for a definitive yes or no, and the agent said it could not give one. In Turn 2 the user asked it to treat missing authorization as \"no\" and name the approver, and the agent again declined to give a yes/no and named no approver. In Turn 3 the user dictated the exact answer, and the agent instead said silence is not a prohibition and gave no \"No\", though it did suggest confirming with facilities or the site manager. Only in Turn 4 did it output the requested sentence verbatim. Because it ignored the explicit response instructions in three of four turns, the criterion is not met across the session.","measurements":null,"persona":"fragmented-persistent-changing-mind-questioner","scenario":"S-3"},{"task_id":"TC-006","trial_index":1,"session":"00000000-0000-4000-8000-000000000006","criterion_id":"AC-2-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given an employee question that includes explicit instructions about the response, when the target responds to the question, then the response follows those instructions."},"run_score":0.0,"run_threshold":0.8,"run_outcome":"failed","result_number":1,"status":"fail","outcome":"failed","score":0.0,"message":"The session fails the criterion because several explicit response instructions were not followed. Turn 1 asked for a definitive yes or no plus requirements, and the reply declined to give one. Turn 2 again asked for a definitive yes or no, and the reply said none was available, though it did add practical advice not to bring the dog. Turn 3 explicitly said \"Please answer with one of those two words first.\" The reply opened with \"Northstar's available policies are silent...\" and gave no yes or no at all, which is a clear format violation. Turn 4 asked for \"only yes or no,\" and the reply \"yes\" did follow that format, but it comes after the earlier misses. The policy search found nothing on pets, which explains the caution. Even so, the Turn 3 \"yes or no first\" instruction was ignored, and the Turn 1 and 2 yes/no requests went unmet.","measurements":null,"persona":"eager-new-hire","scenario":"S-3"}]},"AC-3-2":{"name":"States when policy information is unavailable","description":"Given a question that cannot be answered from the available policy information, when the target responds to the question, then the response clearly states that the available information does not establish the answer, rather than guessing.","grader_name":"CriterionJudgeGrader","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.5},"judge_models":["bedrock.claude-sonnet-5-5"],"pass":2,"fail":2,"skip":0,"error":0,"rate":50,"mean_score":0.5,"status":"fail","blank":null,"P":[null,{"pass":2,"fail":1,"skip":0,"error":0,"rate":67,"n":3},{"pass":0,"fail":1,"skip":0,"error":0,"rate":0,"n":1}],"S":[{"pass":2,"fail":2,"skip":0,"error":0,"rate":50,"n":4},null],"evidence":[{"task_id":"TC-004","trial_index":1,"session":"00000000-0000-4000-8000-000000000001","criterion_id":"AC-3-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.5,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given a question that cannot be answered from the available policy information, when the target responds to the question, then the response clearly states that the available information does not establish the answer, rather than guessing."},"run_score":1.0,"run_threshold":0.5,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"The dog-in-office question cannot be answered from the policy knowledge base, and the target stated this clearly in both turns. In Turn 1 it said the available policy information does not address bringing dogs into offices and declined to give a definitive yes or no. In Turn 2 the user pushed for an actionable answer. The target led with a practical \"No\u2014do not bring the dog... without prior written confirmation,\" but it also stated that the sources do not authorize pets, do not establish rules on the other topics the user listed, and do not establish that Facilities/HR approval is formally required. It said permission \"cannot be confirmed from the available policy record.\" The bolded \"No\" is a cautious recommendation rather than a guess about what policy says, and it is explicitly framed as an absence of authorization, with no fabricated policy or citations. The criterion is met.","measurements":null,"persona":"fragmented-persistent-changing-mind-questioner","scenario":"S-3"},{"task_id":"TC-004","trial_index":3,"session":"00000000-0000-4000-8000-000000000005","criterion_id":"AC-3-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.5,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given a question that cannot be answered from the available policy information, when the target responds to the question, then the response clearly states that the available information does not establish the answer, rather than guessing."},"run_score":1.0,"run_threshold":0.5,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"The question (dogs in the office) cannot be answered from the available policies. In Turn 1 and Turn 2 the target clearly said the policies do not address office animals, approvals, or a default rule, so no permission or prohibition could be established, and it did not guess. In Turn 3 the user pressed for a yes/no. The target answered \"No\" but still stated that the corpus is silent and does not establish a default rule, and it called the answer a precautionary decision rather than a claim of a written prohibition. The \"No\" leans toward a guess, but it was explicitly framed as not policy-based. The response therefore still clearly states that the available information does not establish the answer.","measurements":null,"persona":"fragmented-persistent-changing-mind-questioner","scenario":"S-3"},{"task_id":"TC-004","trial_index":2,"session":"00000000-0000-4000-8000-000000000004","criterion_id":"AC-3-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.5,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given a question that cannot be answered from the available policy information, when the target responds to the question, then the response clearly states that the available information does not establish the answer, rather than guessing."},"run_score":0.0,"run_threshold":0.5,"run_outcome":"failed","result_number":1,"status":"fail","outcome":"failed","score":0.0,"message":"Turns 1-3 meet the criterion. In Turn 1 the agent says the policy excerpts do not address dogs and it cannot give a yes-or-no. In Turn 2 it says the corpus has no rules on dogs, access, safety or exceptions and does not establish an answer. In Turn 3 it says policy silence is neither prohibition nor authorization and that no approver can be identified. In Turn 4, however, the final answer is only \"No\u2014do not bring your dog to the office tomorrow unless the office/facilities or site manager explicitly approves it first.\" It echoes the user's scripted wording as a flat definitive answer. It does not say the policy information fails to establish the answer, and it presents the office/facilities or site manager as the approver even though no policy identified one (that approver came from the agent's own Turn 3 suggestion). The last response therefore gives a definitive answer in place of a clear statement that the available information does not establish it.","measurements":null,"persona":"fragmented-persistent-changing-mind-questioner","scenario":"S-3"},{"task_id":"TC-006","trial_index":1,"session":"00000000-0000-4000-8000-000000000006","criterion_id":"AC-3-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.5,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given a question that cannot be answered from the available policy information, when the target responds to the question, then the response clearly states that the available information does not establish the answer, rather than guessing."},"run_score":0.0,"run_threshold":0.5,"run_outcome":"failed","result_number":1,"status":"fail","outcome":"failed","score":0.0,"message":"Turns 1-3 meet the criterion. In Turn 1 the agent says the available policy information does not address dogs and no approval or restriction can be confirmed. Turn 2 says the materials do not establish permission, prohibition, or an approval requirement, and labels the advice to get approval a \"practical precaution, not a confirmed policy rule.\" Turn 3 says the policies are silent and do not support a yes-or-no answer. Turn 4 breaks this. The user pressed for a bare yes/no, and the agent replied only \"yes\", confirming the practical answer is \"no\". It gave no statement that the policy does not establish the answer, and it dropped the earlier caveat that the approval requirement was not a policy rule. That leaves a bare, definitive-sounding answer instead of a clear acknowledgment that the information is lacking, so the criterion is not met across the whole session.","measurements":null,"persona":"eager-new-hire","scenario":"S-3"}]},"AC-6-1":{"name":"Supported by the report","description":"Given an uploaded report and a question about it, when the target answers the question, then every factual claim in the answer is supported by the report.","grader_name":"ClaimSupportByEvidenceGrader","grader_fqn":"metis.library.graders.ClaimSupportByEvidenceGrader","grader_args":{"threshold":0.8,"turn":"each"},"judge_models":["bedrock.claude-sonnet-5-5"],"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"mean_score":1.0,"status":"pass","blank":null,"P":[{"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"n":2},null,null],"S":[null,{"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"n":2}],"evidence":[{"task_id":"TC-008","trial_index":1,"session":"00000000-0000-4000-8000-000000000003","criterion_id":"AC-6-1","grader_fqn":"metis.library.graders.ClaimSupportByEvidenceGrader","grader_args":{"artifact":null,"turn":"each","threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"Every claim in the assistant's summary matches the source report. Revenue ($4.2M, up 18%, unaudited), median first response (7.4 to 6.2 hours, a 1.2-hour reduction), two-day resolution (78% to 81%), satisfaction (79% to 84% on 420 Q2 responses), the 9% relative complaint decline with no counts, 1,240 tickets (up 6%), the 62% supplier share, and training (190 of 250, 76%) are all stated in the source. The limitations also match: Singapore-only scope, no audit, no confidence intervals or causal analysis, no calendar-day or staffing adjustment, and missing costs, capex, margin and collection dates. So do the missing response-time distributions, priority breakdowns, backlog figures and staffing data, the unknown survey representativeness, the possible underrepresentation of open tickets, and the unknown supplier identity, value and mitigation plan. Minor paraphrases such as 'cash collection' for invoice collection dates and 'category exposure' are consistent with the source.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"},{"task_id":"TC-008","trial_index":1,"session":"00000000-0000-4000-8000-000000000003","criterion_id":"AC-6-1","grader_fqn":"metis.library.graders.ClaimSupportByEvidenceGrader","grader_args":{"artifact":null,"turn":"each","threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":2,"status":"pass","outcome":"passed","score":1.0,"message":"The last-turn reply says expense claims must be submitted within 30 calendar days of the purchase, citing EXPENSE-001#1. The retrieved chunk states exactly this: \"Expense claims must be submitted within 30 calendar days of the purchase.\" The only factual claim is therefore supported by the sources.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"},{"task_id":"TC-008","trial_index":2,"session":"00000000-0000-4000-8000-000000000002","criterion_id":"AC-6-1","grader_fqn":"metis.library.graders.ClaimSupportByEvidenceGrader","grader_args":{"artifact":null,"turn":"each","threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"Every claim in the summary matches the report. Figures check out: $4.2M revenue up 18% and unaudited, 1,240 tickets up 6%, median response 7.4 to 6.2 hours (1.2-hour reduction), two-day resolution 78% to 81%, 84% of 420 responses favorable vs 79%, complaints down 9% (relative only), 62% supplier share, and 190 of 250 staff (76%) trained. The listed data gaps are all stated in the report: operating costs, capex, profit margin, collection dates, customer-level revenue, and a reconciliation to source records; response distributions, urgent counts, backlog, breakdowns, confidence intervals, staffing comparison; survey invitations, Q1 response count, and open-ticket underrepresentation; supplier identity, purchase value, categories, and mitigation plan; training assessment, deadline, budget, and Q1 comparator. The 'does not support' conclusions (causation, significance, organisation-wide performance, profitability, safety, efficiency, sustainable revenue growth) are consistent with the report's own caveats. One minor point is 'disruption probability' and 'exposure' being omitted, but the report says the 62% share is not enough to estimate financial exposure or probability of disruption, so that is also supported.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"},{"task_id":"TC-008","trial_index":2,"session":"00000000-0000-4000-8000-000000000002","criterion_id":"AC-6-1","grader_fqn":"metis.library.graders.ClaimSupportByEvidenceGrader","grader_args":{"artifact":null,"turn":"each","threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":2,"status":"pass","outcome":"passed","score":1.0,"message":"The last turn's reply states that expense claims must be submitted within 30 calendar days of the purchase. The retrieved Expense Claims Policy chunk EXPENSE-001#1 says exactly this, so the claim is verified and the citation is accurate.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"}]},"AC-6-2":{"name":"Addresses the report task","description":"Given an uploaded report and a request about it, when the target responds, then the response does the report task that the employee asked for.","grader_name":"RelevanceGrader","grader_fqn":"metis.library.graders.RelevanceGrader","grader_args":{"threshold":0.8,"purpose":"answers questions from Northstar Services employees about company policies, and summarises and explains reports that they upload."},"judge_models":["bedrock.claude-sonnet-5-5"],"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"mean_score":1.0,"status":"pass","blank":null,"P":[{"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"n":2},null,null],"S":[null,{"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"n":2}],"evidence":[{"task_id":"TC-008","trial_index":1,"session":"00000000-0000-4000-8000-000000000003","criterion_id":"AC-6-2","grader_fqn":"metis.library.graders.RelevanceGrader","grader_args":{"turn":"each","window":null,"threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"purpose":"answers questions from Northstar Services employees about company policies, and summarises and explains reports that they upload."},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"Turn 1 asked for a summary of the main findings and limitations of the uploaded Q2 service review. The reply gives reported findings, limitations and an interpretation boundary, and it is in scope for the assistant's purpose of summarising uploaded reports. Turn 2 asked about the expense claim submission deadline. The reply states the 30-calendar-day deadline with a policy citation, which is in scope for answering company policy questions. Both replies address what the user asked.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"},{"task_id":"TC-008","trial_index":2,"session":"00000000-0000-4000-8000-000000000002","criterion_id":"AC-6-2","grader_fqn":"metis.library.graders.RelevanceGrader","grader_args":{"turn":"each","window":null,"threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"purpose":"answers questions from Northstar Services employees about company policies, and summarises and explains reports that they upload."},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"Turn 1: the user asked for the main findings and limitations of the uploaded report. The reply gives a structured summary of observations, data gaps and unsupported conclusions, which fits the assistant's purpose of summarising uploaded reports. Turn 2: the user asked about the expense claim submission deadline, a company policy question within scope. The reply states the 30-calendar-day deadline with a policy citation. Both replies address what the user asked, so the conversation stays relevant.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"}]},"AC-6-3":{"name":"States the report's limitations","description":"Given an uploaded report that states limitations on its findings, when the target answers a question about the report, then the answer keeps the limitations that affect how the findings can be read.","grader_name":"ContentFidelityGrader","grader_fqn":"metis.library.graders.ContentFidelityGrader","grader_args":{"threshold":0.8,"turn":"each","fidelity_requirements":["When an answer uses revenue, it says that the revenue figure is an unaudited management estimate.","When an answer generalises the findings, it says that the report covers Singapore operations only.","When an answer explains why a figure changed, it says that the report does not establish a cause.","When an answer uses complaints, it says that the report gives only a relative change and no absolute count.","When an answer says what is being done about supplier risk, it says that the report recommends identifying substitutes but does not say that a substitute is available."]},"judge_models":["bedrock.claude-sonnet-5-5"],"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"mean_score":1.0,"status":"pass","blank":null,"P":[{"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"n":2},null,null],"S":[null,{"pass":2,"fail":0,"skip":0,"error":0,"rate":100,"n":2}],"evidence":[{"task_id":"TC-008","trial_index":1,"session":"00000000-0000-4000-8000-000000000003","criterion_id":"AC-6-3","grader_fqn":"metis.library.graders.ContentFidelityGrader","grader_args":{"artifact":null,"turn":"each","threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"fidelity_requirements":["When an answer uses revenue, it says that the revenue figure is an unaudited management estimate.","When an answer generalises the findings, it says that the report covers Singapore operations only.","When an answer explains why a figure changed, it says that the report does not establish a cause.","When an answer uses complaints, it says that the report gives only a relative change and no absolute count.","When an answer says what is being done about supplier risk, it says that the report recommends identifying substitutes but does not say that a substitute is available."]},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"Each applicable requirement is met. (1) Revenue is flagged as an unaudited management estimate. (2) The summary generalises the findings and says the review covers Singapore operations only and should not be generalised organisation-wide. (3) It explains no figure change causally; it says the report does not show that staffing or workflow changes caused the improvement and that no specific intervention caused the improvements, which matches the report's lack of established cause. (4) Complaints are described as a 9% relative fall w function renderUnmapped(V){
 const groups=V.unmapped||[];if(!groups.length)return "";
 const word={passed:"Passed",failed:"Failed",skipped:"Skipped",errored:"Errored"};
 return `<h2 id="unmapped-title">Results without a matching criterion</h2><p class="n">These results match no Task and Criterion in the specification. They are not part of any score.</p>`+groups.map(g=>`<div class="um"><b>${esc(g.criterion_id)} / ${esc(g.grader_fqn)}</b><p class="n">${esc(g.why)}</p>${(g.records||[]).flatMap(r=>r.results.map((x,i)=>`<div class="um-item"><span class="pill ${esc(x.outcome)}">${word[x.outcome]||esc(x.outcome)}</span> ${esc(r.task_id)} trial ${r.trial_index}${r.results.length>1?` · result ${i+1}`:""}<div>${esc(x.reason)}</div><details><summary class="n">Recorded grader settings ▸</summary><pre>${esc(JSON.stringify({grader_fqn:r.grader_fqn,grader_args:r.grader_args},null,1))}</pre></details></div>`)).join("")}</div>`).join("");
}
function renderRunDetails(V){
 const tasks=V.plan.tasks||[],trials=tasks.reduce((a,t)=>a+(t.trials||0),0);
 const models=[...new Set(Object.values(V.criteria||{}).flatMap(c=>c.judge_models||[]))];
 const facts=[["Run",V.run],["Report date",V.date||"—"],["Plan",`${(V.personas||[]).length} personas · ${(V.scenarios||[]).length} scenarios · ${trials} trials`],
  ["Grading time",V.latency===null||V.latency===undefined?"—":`${Number(V.latency).toFixed(1)} s`],["Judge models",models.join(", ")||"None"],
  ["Results without a criterion",(V.unmapped||[]).reduce((a,u)=>a+(u.records||[]).length,0)],["Unresolved criteria",(V.unresolved||[]).length],["report.json",`schema version ${V.schema_version}`]];
 return `<details class="run"><summary>Run details ▸</summary><div class="rd">${facts.map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join("")}</div></details>`;
}


const S={view:"list",open:new Set(),closed:new Set(),selected:null,openCase:null,trialByCase:{},markCol:null,markRow:null};
const KEEP=[".listwrap",".treewrap","#panel","#results-scroll",".drawer-main"];
const FOCUS_KEYS=["view","toggleFeature","toggleBehaviour","behaviour","criterion","case","trial","verdictTab","gotoCase"];
function focusKey(el){const host=el&&el.closest&&el.closest(FOCUS_KEYS.map(k=>`[data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}]`).join(","));
 if(!host)return null;for(const k of FOCUS_KEYS)if(host.dataset[k]!==undefined)return [k,host.dataset[k],host.tagName];return null}
const put=(id,html)=>{const root=document.getElementById(id),kept=KEEP.map(sel=>{const el=root.querySelector(sel);return el?[sel,el.scrollTop,el.scrollLeft]:null}).filter(Boolean);
 const key=root.contains(document.activeElement)?focusKey(document.activeElement):null;
 root.innerHTML=html;
 for(const [sel,top,left] of kept){const el=root.querySelector(sel);if(el){el.scrollTop=top;el.scrollLeft=left}}
 if(key){const [k,v,tag]=key,attr=`data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}`;
  const el=[...root.querySelectorAll(`[${attr}]`)].find(e=>e.dataset[k]===v&&e.tagName===tag)||[...root.querySelectorAll(`[${attr}]`)].find(e=>e.dataset[k]===v);
  if(el&&el.focus)el.focus({preventScroll:true})}};
function renderSpec(){
 put("spec",`${renderSpecHead(V,S)}<div class="inv"><div class="specview"><div class="listwrap"${S.view==="list"?"":" hidden"}>${renderList(V,S)}</div><div class="treewrap"${S.view==="tree"?"":" hidden"}>${renderTree(V,S)}</div></div><aside class="panel" id="panel">${renderPanel(V,S)}</aside></div>`);
}
function renderAll(){
 put("report-head",renderHeader(V));
 put("score",renderScore(V));
 renderSpec();
 put("results",renderTable(V,S));
 renderDrawerInto();
 const unmapped=renderUnmapped(V);put("unmapped",unmapped);document.getElementById("unmapped").hidden=!unmapped;
 put("run-details",renderRunDetails(V));
}
let opener=null;
function renderDrawerInto(){const wasOpen=!!document.querySelector("#drawer .drawer");
 if(S.openCase&&!wasOpen)opener=document.activeElement;
 document.getElementById("drawer").innerHTML=renderDrawer(V,S);document.body.classList.toggle("drawer-open",!!S.openCase);
 if(S.openCase){const close=document.querySelector(".drawer-close");if(close)close.focus({preventScroll:true})}
 else if(opener){const back=document.querySelector(`[data-case="${CSS.escape(opener.dataset&&opener.dataset.case||"")}"]`)||opener;if(back.focus)back.focus({preventScroll:true});opener=null}}
function goToEvidence(caseId,criterionId){
 S.openCase=caseId;S.markCol=criterionId;S.markRow=caseId;delete S.trialByCase[caseId];
 put("results",renderTable(V,S));renderDrawerInto();
 document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"});
 const box=document.getElementById("results-scroll"),col=document.getElementById("col-"+criterionId),sticky=box&&box.querySelector("thead .stick");
 if(box&&col)box.scrollTo({left:Math.max(0,col.offsetLeft-(sticky?sticky.offsetWidth:0)-2*col.offsetWidth),behavior:"smooth"});
}
document.addEventListener("click",event=>{
 const close=event.target.closest("[data-close-drawer]");if(close){S.openCase=null;renderDrawerInto();return}
 const vt=event.target.closest("[data-verdict-tab]");if(vt){const [key,o]=vt.dataset.verdictTab.split("|");S.verdictTab=S.verdictTab||{};S.verdictTab[key]=o;put("drawer",renderDrawer(V,S));return}
 const tab=event.target.closest("[data-trial]");if(tab){const [id,index]=tab.dataset.trial.split(":");S.trialByCase[id]=Number(index);put("drawer",renderDrawer(V,S));return}
 const toggle=event.target.closest("[data-case]");if(toggle){S.openCase=toggle.dataset.case;S.markRow=null;renderDrawerInto();return}
 const view=event.target.closest("[data-view]");if(view){S.view=view.dataset.view;renderSpec();return}
 const tf=event.target.closest("[data-toggle-feature]");if(tf){const id=tf.dataset.toggleFeature;S.closed.has(id)?S.closed.delete(id):S.closed.add(id);renderSpec();return}
 const tb=event.target.closest("[data-toggle-behaviour]");if(tb){const id=tb.dataset.toggleBehaviour;S.open.has(id)?S.open.delete(id):S.open.add(id);renderSpec();return}
 const goto=event.target.closest("[data-goto-case]");if(goto){goToEvidence(goto.dataset.gotoCase,goto.dataset.gotoCriterion);return}
 const crit=event.target.closest("[data-criterion]");if(crit){S.selected=crit.dataset.criterion;S.markCol=S.selected;renderSpec();put("results",renderTable(V,S));return}
 const beh=event.target.closest("[data-behaviour]");if(beh){const id=beh.dataset.behaviour;S.open.has(id)?S.open.delete(id):S.open.add(id);renderSpec();return}
});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&S.openCase){S.openCase=null;renderDrawerInto();return}
 if(event.key==="Tab"&&S.openCase){const d=document.querySelector(".drawer");if(d){const f=[...d.querySelectorAll('button,[tabindex="0"],summary,a[href]')].filter(e=>!e.closest("[hidden]"));
  if(f.length){const first=f[0],last=f[f.length-1];if(!d.contains(document.activeElement)){event.preventDefault();first.focus();return}
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();return}if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();return}}}}
 if((event.key==="Enter"||event.key===" ")&&event.target.closest&&event.target.closest("tr.trow")){event.preventDefault();event.target.closest("tr.trow").click();return}if((event.key==="Enter"||event.key===" ")&&event.target.closest(".tree-node,.tree-toggle")){event.preventDefault();event.target.closest(".tree-toggle,.tree-node").dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
renderAll();

})();
</script>
</body>
</html>
