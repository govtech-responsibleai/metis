mitted and you do not have approval, do not bring your dog into the office. Make alternate arrangements or obtain advance approval from the appropriate office or workplace contact.","errors":[]}],"conversationProblem":null,"category":"succeeded","features":["Employee policy question answering","Request routing"]},{"task_id":"TC-006","trial_index":1,"id":"TC-006-eager-new-hire-1","session":"44db0e4b-0582-4dd8-b5b3-90221914aafc","sessionUrl":"https://gcapdev.aip.gov.sg/langfuse/project/cmvp7ubyb0001021vboemw2i3/sessions/44db0e4b-0582-4dd8-b5b3-90221914aafc","persona":"eager-new-hire","scenario":"S-3","stopReason":"goal_achieved","message":"goal_achieved","failureSource":"outcome","simulated_turns_completed":3,"duration":67.9,"attempt":1,"conversation":[{"turn":1,"user":"Can I bring my dog to the Northstar office for one day? I have an event right after work and won\u2019t have time to go home and pick her up. Please check the company policy and give me a definitive yes or no.","target":"I can\u2019t provide a definitive yes-or-no answer from the available policy information. The retrieved Northstar policies address remote work and equipment, but do not state whether dogs are permitted in the office or identify any exceptions or conditions.","errors":[]},{"turn":2,"user":"Please check the full employee handbook and any workplace, facilities, health and safety, or office access policies\u2014not just remote work and equipment. If pets aren\u2019t explicitly permitted, determine whether that means I need prior approval or cannot bring her, and give me a definitive yes or no for bringing my dog tomorrow.","target":"I cannot determine definitively whether dogs are permitted at the Northstar office from the available policy corpus. The retrieved materials do not include the employee handbook or workplace, facilities, health and safety, or office access provisions addressing animals, nor do they identify any approval process or exceptions. Therefore, the available evidence does not support classifying dogs as permitted, prohibited, or conditionally permitted.","errors":[]},{"turn":3,"user":"I need a practical yes-or-no decision, not a classification of the policy. Since there is no policy confirming pets are allowed and no approval process is identified, should I bring my dog to the office tomorrow\u2014yes or no?","target":"No\u2014do not bring your dog to the office tomorrow unless you obtain explicit prior approval from the appropriate workplace or facilities contact.","errors":[]}],"conversationProblem":null,"category":"succeeded","features":["Employee policy question answering","Request routing"]},{"task_id":"TC-008","trial_index":1,"id":"TC-008-direct-employee-questioner-1","session":"949090b5-5cbe-4d7d-a8e8-9263d163a5a3","sessionUrl":"https://gcapdev.aip.gov.sg/langfuse/project/cmvp7ubyb0001021vboemw2i3/sessions/949090b5-5cbe-4d7d-a8e8-9263d163a5a3","persona":"direct-employee-questioner","scenario":"S-5","stopReason":"goal_achieved","message":"goal_achieved","failureSource":"outcome","simulated_turns_completed":2,"duration":52.8,"attempt":1,"conversation":[{"turn":1,"user":"Summarise the main findings and limitations of this report.","target":"## Main reported findings\n\n- **Revenue:** Q2 revenue was reported as **$4.2 million**, an **18% increase from Q1**. This is an **unaudited management estimate**, not an independently verified result.\n- **Service demand:** The teams recorded **1,240 new tickets**, reported as **6% above Q1**. This measures tickets created, not total work completed; reopened tickets and quarter-end work in progress were not reported.\n- **Response and resolution:** Median first-response time fell from **7.4 to 6.2 hours**\u2014a reported **1.2-hour reduction**. The share resolved within two days rose from **78% to 81%**, a **three-percentage-point increase**. These are aggregate observations, not evidence that every customer received faster service or that a specific intervention caused the improvement.\n- **Customer feedback:** Favorable survey responses increased from **79% to 84%**, a **five-percentage-point increase**, based on **420 Q2 responses**. The sample\u2019s representativeness is unknown.\n- **Complaints:** Complaints reportedly fell **9% relative to Q1**, but absolute counts and complaint categories are missing. The report therefore does not establish how many complaints occurred or whether every complaint type declined.\n- **Supplier concentration:** One supplier represented **62% of Q2 purchases**, which the report identifies as a concentration risk. The figure does not quantify disruption exposure or show that a disruption occurred.\n- **Training:** **190 of 250 eligible staff (76%)** had completed required training by the reporting cutoff. Completion is not evidence that staff acquired the relevant skills or that operational risk declined.\n\n## Material limitations and missing data\n\n- The review covers **Singapore operations only** and should not be presented as organisation-wide performance.\n- Revenue lacks operating costs, capital expenditure, profit margin, collection timing, customer-level detail, and reconciliation data. The report therefore does **not support claims about improved profitability, cash generation, unit economics, customer diversification, or revenue sustainability**.\n- Service comparisons lack response-time distributions, urgent-ticket counts, unresolved backlog, priority or ticket-type breakdowns, confidence intervals, and a Q1-to-Q2 staffing comparison. The report cannot attribute the changes to a staffing or workflow intervention or establish statistical significance.\n- Survey limitations include missing invitation and Q1 response counts and possible under-representation of customers whose tickets remained open. The results should not be generalized to all customers without further evidence.\n- Supplier analysis lacks the supplier identity, purchase categories and value, Q1 comparison, contract or exit terms, tested substitutes, and a mitigation plan. The report does not support claims that supplier dependency has been resolved, or that a security incident or service failure occurred.\n- The report uses rounded aggregate values, has no record-level extracts or independent audit, and did not perform a statistical test, randomized intervention, or causal analysis. Its comparisons are descriptive management observations, not proof of causation.\n\n## Overall interpretation\n\nThe evidence supports a **cautious description of several favorable Q2 aggregate changes alongside unresolved financial, supplier, survey, and measurement risks**. It does not support concluding that Northstar as a whole became more profitable, safer, or more efficient, or that any particular initiative caused the reported changes. Important follow-up questions concern financial and complaint baselines, supplier continuity, service distributions and staffing, channel comparability, and survey-response bias.","errors":[]},{"turn":2,"user":"Separately, what's the deadline for submitting an expense claim?","target":"Expense claims must be submitted within **30 calendar days of the purchase**. [EXPENSE-001#1]","errors":[]}],"conversationProblem":null,"category":"succeeded","features":["Report analysis","Request routing"]}]},"scores":{"graderPassRate":{"rate":72,"mean_score":0.7222222222222222,"pass":10,"fail":6,"skip":0,"error":0,"ran":16},"trialSuccess":{"rate":100,"successful":4,"attempted":4}},"plan":{"personas":["direct-employee-questioner","fragmented-persistent-changing-mind-questioner","eager-new-hire"],"tasks":[{"id":"TC-004","scenario":"S-3","personas":["fragmented-persistent-changing-mind-questioner"],"trials":2,"trialsPlanned":2,"trialsRun":2,"personasRun":["fragmented-persistent-changing-mind-questioner"],"gradersAsked":4,"gradersScored":4},{"id":"TC-006","scenario":"S-3","personas":["eager-new-hire"],"trials":1,"trialsPlanned":1,"trialsRun":1,"personasRun":["eager-new-hire"],"gradersAsked":4,"gradersSc d 'No.', then said the material does not establish that the dog is barred, which is contradictory and ambiguous. In Turn 5 it led with 'No.' and told the user not to bring the dog, turning policy silence into a default no. That conflicts with its own Turn 2 and 3 statements that no default-no rule is established. The final answer says the policy does not authorize bringing the dog, but it never says the information fails to establish the answer, and it effectively guesses a no.","measurements":null,"persona":"fragmented-persistent-changing-mind-questioner","scenario":"S-3"},{"task_id":"TC-004","trial_index":2,"session":"abbffcea-78b5-4a04-a9b2-07e2668a595a","criterion_id":"AC-3-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.5,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given a question that cannot be answered from the available policy information, when the target responds to the question, then the response clearly states that the available information does not establish the answer, rather than guessing."},"run_score":1.0,"run_threshold":0.5,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"In Turn 1 the target says the policy material does not address dogs or pets in the office, so a definitive yes/no cannot be established. In Turn 2 it repeats that the corpus does not establish a People-approval requirement, any office-access or safety rules, or an approval path, and it declines to guess. In Turn 3 the user explicitly asks for a practical go/no-go and not a claim about written policy. The target answers \"No\" only as a conditional recommendation (\"if pets are not expressly permitted and you do not have approval\") and does not assert what the policy says. This turn does not restate the policy gap, and \"obtain advance approval from the appropriate office\" is vague. Even so, it does not fabricate policy, and the policy-grounded responses in Turns 1 and 2 were clear.","measurements":null,"persona":"fragmented-persistent-changing-mind-questioner","scenario":"S-3"},{"task_id":"TC-006","trial_index":1,"session":"44db0e4b-0582-4dd8-b5b3-90221914aafc","criterion_id":"AC-3-2","grader_fqn":"metis.library.graders.CriterionJudgeGrader","grader_args":{"threshold":0.5,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"criterion":"Given a question that cannot be answered from the available policy information, when the target responds to the question, then the response clearly states that the available information does not establish the answer, rather than guessing."},"run_score":0.0,"run_threshold":0.5,"run_outcome":"failed","result_number":1,"status":"fail","outcome":"failed","score":0.0,"message":"Turns 1 and 2 met the criterion. The delegate said the retrieved policies (remote work, equipment, AI, security, data, travel) do not address dogs or office access. They declined to give a yes or no and did not guess. In Turn 3 the user pressed for a practical yes or no, and the agent answered \"No\u2014do not bring your dog... unless you obtain explicit prior approval from the appropriate workplace or facilities contact.\" That answer never says the available policy information does not establish the answer. It presents a definitive \"No\" and implies an approval requirement that no retrieved policy supports. It also refers to a \"workplace or facilities contact\" that was never identified. This is a guess presented as a decision, so the session does not consistently meet the criterion.","measurements":null,"persona":"eager-new-hire","scenario":"S-3"}]},"AC-6-1":{"name":"Supported by the report","description":"Given an uploaded report and a question about it, when the target answers the question, then every factual claim in the answer is supported by the report.","grader_name":"ClaimSupportByEvidenceGrader","grader_fqn":"metis.library.graders.ClaimSupportByEvidenceGrader","grader_args":{"threshold":0.8,"turn ome":"passed","result_number":2,"status":"pass","outcome":"passed","score":1.0,"message":"The assessed reply (Turn 2) states that expense claims must be submitted within 30 calendar days of the purchase, citing EXPENSE-001#1. The retrieved chunk says exactly this: \"Expense claims must be submitted within 30 calendar days of the purchase.\" The only claim is directly supported by the source.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"}]},"AC-6-2":{"name":"Addresses the report task","description":"Given an uploaded report and a request about it, when the target responds, then the response does the report task that the employee asked for.","grader_name":"RelevanceGrader","grader_fqn":"metis.library.graders.RelevanceGrader","grader_args":{"threshold":0.8,"purpose":"answers questions from Northstar Services employees about company policies, and summarises and explains reports that they upload."},"judge_models":["bedrock.claude-sonnet-5-5"],"pass":1,"fail":0,"skip":0,"error":0,"rate":100,"mean_score":1.0,"status":"pass","blank":null,"P":[{"pass":1,"fail":0,"skip":0,"error":0,"rate":100,"n":1},null,null],"S":[null,{"pass":1,"fail":0,"skip":0,"error":0,"rate":100,"n":1}],"evidence":[{"task_id":"TC-008","trial_index":1,"session":"949090b5-5cbe-4d7d-a8e8-9263d163a5a3","criterion_id":"AC-6-2","grader_fqn":"metis.library.graders.RelevanceGrader","grader_args":{"turn":"each","window":null,"threshold":0.8,"model":"bedrock.claude-sonnet-5-5","max_input_tokens":128000,"purpose":"answers questions from Northstar Services employees about company policies, and summarises and explains reports that they upload."},"run_score":1.0,"run_threshold":0.8,"run_outcome":"passed","result_number":1,"status":"pass","outcome":"passed","score":1.0,"message":"Turn 1: the user asked for a summary of the uploaded report's findings and limitations. The assistant routed to the analysis delegate and returned a structured summary of findings, limitations, and missing data, which is directly on topic and within the operator's purpose of summarising uploaded reports. Turn 2: the user asked about the expense claim submission deadline, a company policy question. The assistant routed to the RAG delegate, searched the knowledge base, and answered with the 30-day deadline and a citation, which directly answers the question. Both replies respond to the user's current message and fit the operator's stated purpose.","measurements":null,"persona":"direct-employee-questioner","scenario":"S-5"}]},"AC-6-3":{"name":"States the report's limitations","description":"Given an uploaded report that states limitations on its findings, when the target answers a question about the report, then the answer keeps the limitations that affect how the findings can be read.","grader_name":"ContentFidelityGrader","grader_fqn":"metis.library.graders.ContentFidelityGrader","grader_args":{"threshold":0.8,"turn":"each","fidelity_requirements":["When an answer uses revenue, it says that the revenue figure is an unaudited management estimate.","When an answer generalises the findings, it says that the report covers Singapore operations only.","When an answer explains why a figure changed, it says that the report does not establish a cause.","When an answer uses complaints, it says that the report gives only a relative change and no absolute count.","When an answer says what is being done about supplier risk, it says that the report recommends identifying substitutes but does not say that a substitute is available."]},"judge_models":["bedrock.claude-sonnet-5-5"],"pass":1,"fail":0,"skip":0,"error":0,"rate":100,"mean_score":1.0,"status":"pass","blank":null,"P":[{"pass":1,"fail":0,"skip":0,"error":0,"rate":100,"n":1},null,null],"S":[null,{"pass":1,"fail":0,"skip":0,"error":0,"rate":100,"n":1}],"evidence":[{"task_id":"TC-008","trial_index":1,"session":"949090b5-5cbe-4d7d-a8e8-9263d163a5a3","criterion_id":"AC-6-3","grader_fqn":"metis.library.graders.ContentFidelityGrader","gra :52.8,"attempt":1,"conversation":[{"turn":1,"user":"Summarise the main findings and limitations of this report.","target":"## Main reported findings\n\n- **Revenue:** Q2 revenue was reported as **$4.2 million**, an **18% increase from Q1**. This is an **unaudited management estimate**, not an independently verified result.\n- **Service demand:** The teams recorded **1,240 new tickets**, reported as **6% above Q1**. This measures tickets created, not total work completed; reopened tickets and quarter-end work in progress were not reported.\n- **Response and resolution:** Median first-response time fell from **7.4 to 6.2 hours**\u2014a reported **1.2-hour reduction**. The share resolved within two days rose from **78% to 81%**, a **three-percentage-point increase**. These are aggregate observations, not evidence that every customer received faster service or that a specific intervention caused the improvement.\n- **Customer feedback:** Favorable survey responses increased from **79% to 84%**, a **five-percentage-point increase**, based on **420 Q2 responses**. The sample\u2019s representativeness is unknown.\n- **Complaints:** Complaints reportedly fell **9% relative to Q1**, but absolute counts and complaint categories are missing. The report therefore does not establish how many complaints occurred or whether every complaint type declined.\n- **Supplier concentration:** One supplier represented **62% of Q2 purchases**, which the report identifies as a concentration risk. The figure does not quantify disruption exposure or show that a disruption occurred.\n- **Training:** **190 of 250 eligible staff (76%)** had completed required training by the reporting cutoff. Completion is not evidence that staff acquired the relevant skills or that operational risk declined.\n\n## Material limitations and missing data\n\n- The review covers **Singapore operations only** and should not be presented as organisation-wide performance.\n- Revenue lacks operating costs, capital expenditure, profit margin, collection timing, customer-level detail, and reconciliation data. The report therefore does **not support claims about improved profitability, cash generation, unit economics, customer diversification, or revenue sustainability**.\n- Service comparisons lack response-time distributions, urgent-ticket counts, unresolved backlog, priority or ticket-type breakdowns, confidence intervals, and a Q1-to-Q2 staffing comparison. The report cannot attribute the changes to a staffing or workflow intervention or establish statistical significance.\n- Survey limitations include missing invitation and Q1 response counts and possible under-representation of customers whose tickets remained open. The results should not be generalized to all customers without further evidence.\n- Supplier analysis lacks the supplier identity, purchase categories and value, Q1 comparison, contract or exit terms, tested substitutes, and a mitigation plan. The report does not support claims that supplier dependency has been resolved, or that a security incident or service failure occurred.\n- The report uses rounded aggregate values, has no record-level extracts or independent audit, and did not perform a statistical test, randomized intervention, or causal analysis. Its comparisons are descriptive management observations, not proof of causation.\n\n## Overall interpretation\n\nThe evidence supports a **cautious description of several favorable Q2 aggregate changes alongside unresolved financial, supplier, survey, and measurement risks**. It does not support concluding that Northstar as a whole became more profitable, safer, or more efficient, or that any particular initiative caused the reported changes. Important follow-up questions concern financial and complaint baselines, supplier continuity, service distributions and staffing, channel comparability, and survey-response bias.","errors":[]},{"turn":2,"user":"Separately, what's the deadline for submitting an expense claim?","t  const word={passed:"Passed",failed:"Failed",skipped:"Skipped",errored:"Errored"};
 const head=`<tr><th class="st-col"></th><th class="sum-col">Trial</th>${cols.map(cid=>`<th class="cc${cid===S.markCol?" mark":""}" title="${esc(criterionName(V,cid))}"><span>${esc(criterionName(V,cid))}</span></th>`).join("")}</tr>`;
 const body=trials.map(t=>{const first=((t.conversation||[])[0]||{}).user||"No conversation was recorded.";
  return `<tr class="trow${t===trial?" on":""}" data-trial="${esc(row.task_id)}:${t.trial_index}" tabindex="0" role="button" aria-pressed="${t===trial}" aria-label="Show trial ${t.trial_index}"><td class="st-col">${statusIcon(t.category)}</td><td class="sum-col"><b>Trial ${t.trial_index}</b><span class="first" title="${esc(first)}">${esc(first)}</span><span class="n end">${esc(endingLine(t))}</span></td>${cols.map(cid=>{const o=outcomeOf((t.results||{})[cid]);return `<td class="pc${cid===S.markCol?" mark":""}">${o?`<span class="pill ${o}">${word[o]}</span>`:""}</td>`}).join("")}</tr>`}).join("");
 const reached=trials.filter(t=>t.category==="succeeded").length,T=V.passRateTarget;
 const ciRows=cols.map(cid=>{const r=row.results[cid],ci=r.confidence_interval,graded=(r.pass||0)+(r.fail||0);
  const lo=ci?Math.round(ci.lower*100):null,hi=ci?Math.round(ci.upper*100):null;
  const plot=ci?`<div class="ci-wide"><span class="ci-track"></span><span class="ci-rng" style="left:${lo}%;width:${hi-lo}%"></span><span class="ci-tg" style="left:${T}%"></span><span class="ci-pt" style="left:${r.rate}%"></span></div>`:'<div class="ci-wide none"></div>';
  return `<div class="ci-row${cid===S.markCol?" mark":""}"><span class="ci-name" title="${esc(criterionName(V,cid))}">${esc(criterionName(V,cid))}</span><span class="ci-rate mono${lowClass(V,r.rate)}">${pct(r.rate)}</span>${plot}<span class="ci-num mono">${ci?`${lo}–${hi}%`:"—"}</span><span class="ci-n">${r.pass||0} of ${graded} passed</span></div>`}).join("");
 const axis=`<div class="ci-row ci-axis"><span></span><span></span><div class="ci-wide ticks">${[0,25,50,75,100].filter(v=>Math.abs(v-T)>8).map(v=>`<span style="left:${v}%"${v===0?' class="first"':v===100?' class="last"':""}>${v}%</span>`).join("")}<span class="tg-label" style="left:${T}%">${T}% target</span></div><span></span><span></span></div>`;
 return `<div class="drawer-back" data-close-drawer></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Trials of ${esc(persona)} · ${esc(scenario)}">
 <div class="drawer-head"><button type="button" class="drawer-close" data-close-drawer aria-label="Close">»</button><span class="n">Results by test case ›</span><b>${esc(persona)} · ${esc(scenario)}</b></div>
 <div class="drawer-body"><div class="drawer-main">
 <div class="dm-head"><div><h3>${esc(persona)} · ${esc(scenario)}</h3><p class="n">${esc((V.describe.S||{})[row.scenario]||"")}</p></div>
 <div class="dm-facts"><div><b class="mono">${trials.length}</b><span>trials ran</span></div><div><b class="mono">${reached}</b><span>reached their goal</span></div></div></div>
 <h4 class="dm-sec">Pass rate and 95% range for each criterion ${tip(`Each row pools this test case's ${trials.length} trials. The dark tick is the pass rate, the grey band is the 95% confidence interval, and the red line is the ${T}% target. When the band crosses the red line, these trials cannot show if the true pass rate is above or below the target.`)}</h4>
 <div class="ci-list">${axis}${ciRows}</div>
 <h4 class="dm-sec">Trials</h4>
 <div class="dt-scroll"><table class="dt"><thead>${head}</thead><tbody>${body}</tbody></table></div>
 ${trial?renderTrialDetail(V,S,row,trial):'<p class="n">No trial record was found for this test case.</p>'}</div></div></aside>`;
}
function renderUnmapped(V){
 const groups=V.unmapped||[];if(!groups.length)return "";
 const word={passed:"Passed",failed:"Failed",skipped:"Skipped",errored:"Errored"};
 return `<h2 id="unmapped-title">Results without a matching criterion</h2><p class="n">These results match no Task and Criterion in the specification. They are not part of any score.</p>`+groups.map(g=>`<div class="um"><b>${esc(g.criterion_id)} / ${esc(g.grader_fqn)}</b><p class="n">${esc(g.why)}</p>${(g.records||[]).flatMap(r=>r.results.map((x,i)=>`<div class="um-item"><span class="pill ${esc(x.outcome)}">${word[x.outcome]||esc(x.outcome)}</span> ${esc(r.task_id)} trial ${r.trial_index}${r.results.length>1?` · result ${i+1}`:""}<div>${esc(x.reason)}</div><details><summary class="n">Recorded grader settings ▸</summary><pre>${esc(JSON.stringify({grader_fqn:r.grader_fqn,grader_args:r.grader_args},null,1))}</pre></details></div>`)).join("")}</div>`).join("");
}
function renderRunDetails(V){
 const tasks=V.plan.tasks||[],trials=tasks.reduce((a,t)=>a+(t.trials||0),0);
 const models=[...new Set(Object.values(V.criteria||{}).flatMap(c=>c.judge_models||[]))];
 const facts=[["Run",V.run],["Report date",V.date||"—"],["Plan",`${(V.personas||[]).length} personas · ${(V.scenarios||[]).length} scenarios · ${trials} trials`],
  ["Grading time",V.latency===null||V.latency===undefined?"—":`${Number(V.latency).toFixed(1)} s`],["Judge models",models.join(", ")||"None"],
  ["Results without a criterion",(V.unmapped||[]).reduce((a,u)=>a+(u.records||[]).length,0)],["Unresolved criteria",(V.unresolved||[]).length],["report.json",`schema version ${V.schema_version}`]];
 return `<details class="run"><summary>Run details ▸</summary><div class="rd">${facts.map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join("")}</div></details>`;
}


const S={view:"list",open:new Set(),closed:new Set(),selected:null,openCase:null,trialByCase:{},markCol:null,markRow:null};
const KEEP=[".listwrap",".treewrap","#panel","#results-scroll",".drawer-main"];
const FOCUS_KEYS=["view","toggleFeature","toggleBehaviour","behaviour","criterion","case","trial","verdictTab","gotoCase"];
function focusKey(el){const host=el&&el.closest&&el.closest(FOCUS_KEYS.map(k=>`[data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}]`).join(","));
 if(!host)return null;for(const k of FOCUS_KEYS)if(host.dataset[k]!==undefined)return [k,host.dataset[k],host.tagName];return null}
const put=(id,html)=>{const root=document.getElementById(id),kept=KEEP.map(sel=>{const el=root.querySelector(sel);return el?[sel,el.scrollTop,el.scrollLeft]:null}).filter(Boolean);
 const key=root.contains(document.activeElement)?focusKey(document.activeElement):null;
 root.innerHTML=html;
 for(const [sel,top,left] of kept){const el=root.querySelector(sel);if(el){el.scrollTop=top;el.scrollLeft=left}}
 if(key){const [k,v,tag]=key,attr=`data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}`;
  const el=[...root.querySelectorAll(`[${attr}]`)].find(e=>e.dataset[k]===v&&e.tagName===tag)||[...root.querySelectorAll(`[${attr}]`)].find(e=>e.dataset[k]===v);
  if(el&&el.focus)el.focus({preventScroll:true})}};
function renderSpec(){
 put("spec",`${renderSpecHead(V,S)}<div class="inv"><div class="specview"><div class="listwrap"${S.view==="list"?"":" hidden"}>${renderList(V,S)}</div><div class="treewrap"${S.view==="tree"?"":" hidden"}>${renderTree(V,S)}</div></div><aside class="panel" id="panel">${renderPanel(V,S)}</aside></div>`);
}
function renderAll(){
 put("report-head",renderHeader(V));
 put("score",renderScore(V));
 renderSpec();
 put("results",renderTable(V,S));
 renderDrawerInto();
 const unmapped=renderUnmapped(V);put("unmapped",unmapped);document.getElementById("unmapped").hidden=!unmapped;
 put("run-details",renderRunDetails(V));
}
let opener=null;
function renderDrawerInto(){const wasOpen=!!document.querySelector("#drawer .drawer");
 if(S.openCase&&!wasOpen)opener=document.activeElement;
 document.getElementById("drawer").innerHTML=renderDrawer(V,S);document.body.classList.toggle("drawer-open",!!S.openCase);
 if(S.openCase){const close=document.querySelector(".drawer-close");if(close)close.focus({preventScroll:true})}
 else if(opener){const back=document.querySelector(`[data-case="${CSS.escape(opener.dataset&&opener.dataset.case||"")}"]`)||opener;if(back.focus)back.focus({preventScroll:true});opener=null}}
function goToEvidence(caseId,criterionId){
 S.openCase=caseId;S.markCol=criterionId;S.markRow=caseId;delete S.trialByCase[caseId];
 put("results",renderTable(V,S));renderDrawerInto();
 document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"});
 const box=document.getElementById("results-scroll"),col=document.getElementById("col-"+criterionId),sticky=box&&box.querySelector("thead .stick");
 if(box&&col)box.scrollTo({left:Math.max(0,col.offsetLeft-(sticky?sticky.offsetWidth:0)-2*col.offsetWidth),behavior:"smooth"});
}
document.addEventListener("click",event=>{
 const close=event.target.closest("[data-close-drawer]");if(close){S.openCase=null;renderDrawerInto();return}
 const vt=event.target.closest("[data-verdict-tab]");if(vt){const [key,o]=vt.dataset.verdictTab.split("|");S.verdictTab=S.verdictTab||{};S.verdictTab[key]=o;put("drawer",renderDrawer(V,S));return}
 const tab=event.target.closest("[data-trial]");if(tab){const [id,index]=tab.dataset.trial.split(":");S.trialByCase[id]=Number(index);put("drawer",renderDrawer(V,S));return}
 const toggle=event.target.closest("[data-case]");if(toggle){S.openCase=toggle.dataset.case;S.markRow=null;renderDrawerInto();return}
 const view=event.target.closest("[data-view]");if(view){S.view=view.dataset.view;renderSpec();return}
 const tf=event.target.closest("[data-toggle-feature]");if(tf){const id=tf.dataset.toggleFeature;S.closed.has(id)?S.closed.delete(id):S.closed.add(id);renderSpec();return}
 const tb=event.target.closest("[data-toggle-behaviour]");if(tb){const id=tb.dataset.toggleBehaviour;S.open.has(id)?S.open.delete(id):S.open.add(id);renderSpec();return}
 const goto=event.target.closest("[data-goto-case]");if(goto){goToEvidence(goto.dataset.gotoCase,goto.dataset.gotoCriterion);return}
 const crit=event.target.closest("[data-criterion]");if(crit){S.selected=crit.dataset.criterion;S.markCol=S.selected;renderSpec();put("results",renderTable(V,S));return}
 const beh=event.target.closest("[data-behaviour]");if(beh){const id=beh.dataset.behaviour;S.open.has(id)?S.open.delete(id):S.open.add(id);renderSpec();return}
});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&S.openCase){S.openCase=null;renderDrawerInto();return}
 if(event.key==="Tab"&&S.openCase){const d=document.querySelector(".drawer");if(d){const f=[...d.querySelectorAll('button,[tabindex="0"],summary,a[href]')].filter(e=>!e.closest("[hidden]"));
  if(f.length){const first=f[0],last=f[f.length-1];if(!d.contains(document.activeElement)){event.preventDefault();first.focus();return}
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();return}if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();return}}}}
 if((event.key==="Enter"||event.key===" ")&&event.target.closest&&event.target.closest("tr.trow")){event.preventDefault();event.target.closest("tr.trow").click();return}if((event.key==="Enter"||event.key===" ")&&event.target.closest(".tree-node,.tree-toggle")){event.preventDefault();event.target.closest(".tree-toggle,.tree-node").dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
renderAll();

})();
</script>
</body>
</html>
